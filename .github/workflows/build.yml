name: Build APK Stable

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-11-jdk

          pip install --upgrade pip
          pip install buildozer cython==0.29.36


      - name: Prepare Android SDK for Buildozer
        run: |

          mkdir -p /home/runner/.buildozer/android/platform/android-sdk


          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=/home/runner/.buildozer/android/platform/android-sdk \
          --licenses || true


          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=/home/runner/.buildozer/android/platform/android-sdk \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"


          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin


          ln -s \
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
          /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager


      - name: Build APK
        run: |

          buildozer -v android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Path-APK
          path: bin/*.apk
