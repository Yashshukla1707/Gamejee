name: Build APK Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 🔥 FIX JAVA (THIS IS WHAT YOU ARE MISSING)
      - name: Setup Java 17
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version

      - name: Install dependencies
        run: |
          sudo apt install -y git zip unzip build-essential \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # 🔥 IMPORTANT: NO sdkmanager, NO manual Android SDK
      # Buildozer handles everything itself now
      - - name: Build APK
          run: |
              rm -r .buildozer
              buildozer -v android debug 2>&1 | tee build.log || true

        - name: Show last part of log
          run: |
            tail -n 100 build.log

        - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
