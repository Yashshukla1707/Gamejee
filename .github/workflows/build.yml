name: Build APK Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROIDAPI: 34
      ANDROIDMINAPI: 21
      BUILDTOOLS: 34.0.0

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-11-jdk

          pip install --upgrade pip
          pip install buildozer cython==0.29.36


      - name: Install Android SDK fixed
        run: |

          mkdir -p $HOME/.buildozer/android/platform

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"


      - name: Create buildozer config
        run: |

          echo "android.api = 34" >> buildozer.spec
          echo "android.minapi = 21" >> buildozer.spec
          echo "android.archs = arm64-v8a" >> buildozer.spec


      - name: Build APK
        run: |

          buildozer android clean
          buildozer -v android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

          name: Path-APK

          path: bin/*.apk
