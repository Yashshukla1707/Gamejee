name: Build APK Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          zip unzip openjdk-17-jdk \
          autoconf automake libtool pkg-config \
          zlib1g-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33
          pip install buildozer==1.5.0
          pip install python-for-android==2024.01.21

      - name: Build APK
        run: |
          buildozer android debug > build.log 2>&1

      - name: Show Log If Failed
        if: failure()
        run: |
          tail -n 500 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: |
            bin/*.apk
            ./**/*.apk
