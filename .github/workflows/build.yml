name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            build-essential \
            wget

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install cython buildozer

      # 🔥 FORCE CLEAN ENV (THIS FIXES BROKEN SDK CACHE)
      - name: Clean old buildozer cache
        run: |
          rm -rf ~/.buildozer || true

      - name: Build APK (NO PROMPT FIX)
        run: |
          export P4A__ANDROID_ACCEPT_SDK_LICENSE=True
          export ANDROIDSDK_ACCEPT_LICENSES=1
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamejee-apk
          path: bin/*.apk
