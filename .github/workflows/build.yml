name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk build-essential

      - name: Install Build tools
        run: |
          python -m pip install --upgrade pip
          pip install cython buildozer

      # 🔥 CRITICAL FIX: PIN STABLE python-for-android
      - name: Force stable p4a version
        run: |
          pip install python-for-android==2024.1.21

      - name: Clean old builds
        run: rm -rf ~/.buildozer || true

      - name: Build APK (force yes)
        run: |
          export P4A__ANDROID_ACCEPT_SDK_LICENSE=True
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamejee-apk
          path: bin/*.apk
