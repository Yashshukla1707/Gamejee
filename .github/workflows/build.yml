name: Build Kivy APK Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            build-essential autoconf libtool pkg-config

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      # 🔥 CLEAN OLD CACHE (IMPORTANT)
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      # 🔥 VERIFY FILES (prevents "No default command set")
      - name: Check project structure
        run: |
          ls -la
          test -f main.py || (echo "main.py missing" && exit 1)
          test -f buildozer.spec || (echo "buildozer.spec missing" && exit 1)

      # 🔥 ACTUAL BUILD COMMAND (FIXES YOUR MAIN ERROR)
      - name: Build APK
        run: |
          buildozer -v android debug

      # 🔍 DEBUG APK LOCATION
      - name: Find APK
        run: |
          echo "Searching APK..."
          find . -type f -name "*.apk" -print

      # ❌ FAIL IF APK NOT FOUND
      - name: Validate APK
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK NOT GENERATED"
            exit 1
          else
            echo "✅ APK FOUND: $APK"
          fi

      # 📦 UPLOAD APK
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
