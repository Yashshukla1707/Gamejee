name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython

      # ==============================
      # 🔥 FIX 1: Install Android tools properly
      # ==============================
      - name: Install Android SDK (FIX sdkmanager error)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip -d cmdline-tools

          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # ==============================
      # 🔥 FIX 2: Install stable build tools ONLY
      # ==============================
      - name: Install Android packages
        run: |
          yes | sdkmanager --sdk_root=$HOME/android-sdk \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      # ==============================
      # 🔥 FIX 3: Accept licenses properly
      # ==============================
      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      # ==============================
      # 🔥 BUILD APK
      # ==============================
      - name: Build APK
        run: buildozer android debug

      # ==============================
      # 🔥 UPLOAD APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
