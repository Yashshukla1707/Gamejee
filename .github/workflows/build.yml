name: Build APK Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            build-essential autoconf libtool pkg-config

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Clean previous builds
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      # ✅ FIX 1: Install correct Android components
      - name: Install Android SDK components
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=/usr/local/lib/android/sdk \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

      # ✅ FIX 2: Accept licenses (REAL SDK PATH)
      - name: Accept Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=/usr/local/lib/android/sdk --licenses || true

      # ✅ FIX 3: Ensure AIDL dependency
      - name: Fix AIDL dependency
