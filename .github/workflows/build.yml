name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # ---------------- JAVA FIX (IMPORTANT) ----------------
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # ---------------- PYTHON ----------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ---------------- SYSTEM DEPENDENCIES ----------------
    - name: Install system packages
      run: |
        sudo apt update
        sudo apt install -y git zip unzip wget openjdk-17-jdk

    # ---------------- BUILD TOOLS ----------------
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    # ---------------- ANDROID SDK FIX ----------------
    - name: Setup Android SDK (FIXED)
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools

        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest

        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_ENV

        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # ---------------- INSTALL REQUIRED SDK PARTS ----------------
    - name: Install Android Build Tools (FIX AIDL ERROR)
      run: |
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    # ---------------- BUILD APK ----------------
    - name: Build APK
      run: |
        buildozer -v android debug
