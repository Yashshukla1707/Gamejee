name: Build Kivy APK (Debug Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            build-essential autoconf libtool pkg-config

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Clean old builds
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      # 🔥 Set Android SDK path
      - name: Set Android environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV

      # 🔥 Accept licenses
      - name: Accept Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=/usr/local/lib/android/sdk --licenses || true

      # 🔥 Install stable build tools (NO 37)
      - name: Install Android SDK components
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 🔥 AIDL fallback
      - name: Install AIDL dependency
        run: |
          sudo apt install -y google-android-build-tools-installer || true

      - name: Init Buildozer
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi

      # 🔥 BUILD STEP
      - name: Build APK
        run: |
          buildozer -v android debug

      # 🔥 DEBUG STEP (THIS IS THE IMPORTANT ONE)
      - name: DEBUG - Find APK files
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print
          echo "Checking buildozer folders..."
          ls -R .buildozer || true
          ls -R bin || true

      # 🔥 VERIFY APK EXISTS (FAIL IF NOT FOUND)
      - name: Validate APK
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK NOT GENERATED"
            exit 1
          else
            echo "✅ APK FOUND: $APK"
          fi

      # 🔥 UPLOAD APK (SAFE PATH)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
