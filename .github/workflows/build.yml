name: Build APK Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            build-essential autoconf libtool pkg-config

      - name: Install Python tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Clean old builds
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      # ✅ IMPORTANT FIX: Install Android SDK components
      - name: Install Android SDK tools
        run: |
          yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ✅ IMPORTANT FIX: Accept ALL licenses
      - name: Accept Android SDK licenses
        run: |
          yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ✅ Safety: ensure AIDL exists (fixes your crash)
      - name: Ensure AIDL dependency
        run: |
          sudo apt install -y google-android-build-tools-installer || true

      - name: Init buildozer if needed
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
