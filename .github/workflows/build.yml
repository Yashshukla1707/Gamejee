name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip

      - name: Install Buildozer (stable pinned)
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 python-for-android==2023.9.16

      - name: Force clean environment (IMPORTANT)
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Disable broken SDK auto-download (CRITICAL FIX)
        run: |
          echo "export P4A_NO_COMPILE=True" >> $GITHUB_ENV
          echo "export P4A_DIST_FORCE_BUILD=1" >> $GITHUB_ENV
          echo "export ANDROIDSDK=ignore" >> $GITHUB_ENV
          echo "export ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Build APK (NO SDKMANAGER USED)
        run: |
          buildozer android debug
