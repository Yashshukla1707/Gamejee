name: Build Kivy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            build-essential autoconf libtool pkg-config

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Clean old builds
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      # 🔥 FIX 1: Correct SDK path
      - name: Set Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV

      # 🔥 FIX 2: Accept ALL licenses (IMPORTANT)
      - name: Accept Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=/usr/local
